{% if site.author.github %}
<div class="page__footer-follow">
  <ul class="social-icons">
    <li><strong>{{ site.data.ui-text[site.locale].follow_label | default: "Follow:" }}</strong></li>
    <li><a href="https://github.com/{{ site.author.github }}"><i class="fab fa-github" aria-hidden="true"></i> GitHub</a></li>
  </ul>
</div>
{% endif %}

<div class="page__footer-copyright">
  Site last updated {{ site.time | date: '%Y-%m-%d' }}, <a href="{{ '/sitemap/' | relative_url }}" style="text-transform: uppercase;">{{ site.data.ui-text[site.locale].site_map | default: "Sitemap" }}</a>
</div>
